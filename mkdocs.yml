  - Concepts:
      - Client Credentials, Explained: concepts/client-credentials.md
      - Tokens, Scopes & Validation: concepts/tokens-and-scopes.md
      - Cognito Building Blocks: concepts/cognito-building-blocks.md
  - Architecture: architecture.md
  - Walkthrough:
      - What Happens on One Click: walkthrough/request-lifecycle.md
      - The Services in Detail: walkthrough/services.md
  - Running It:
      - Setup & Runbook: running/runbook.md
      - Testing Without AWS (moto): running/testing-with-moto.md
  - FAQ: faq.md
validation:
  nav:
    omitted_files: warn
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn
plugins:
  - search
