[project]
name = "cognito-m2m-local-demo-docs"
version = "0.1.0"
description = "Documentation build environment for the Cognito M2M local demo"
readme = "README.md"
requires-python = ">=3.13"
# The application code is Java/TypeScript; this project exists only to pin the
# Python toolchain used to build the MkDocs site (see mkdocs.yml, docs/).
dependencies = [
    "mkdocs>=1.6.0",
]

[dependency-groups]
# `uv run --group test` for exercising the services against a fake Cognito.
# See docs/running/testing-with-moto.md.
test = [
    "moto[cognitoidp,server]>=5.0.0",
    "flask>=3.0.0",
    "boto3>=1.34.0",
]

[tool.uv]
package = false
